<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhiFlow — Truth-Namer Playground</title>
    <style>
        :root {
            --phi: 1.618;
            --lambda: 0.618;
            --bg: #0a0a0f;
            --pane-bg: #12121f;
            --border: #2a2a4a;
            --accent-primary: #b488ff;
            --accent-secondary: #61efce;
            --text: #e0e0ff;
            --text-dim: #7a7aaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em;
            padding: 15px 25px 5px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.75rem;
            padding: 0 25px 15px;
            border-bottom: 1px solid var(--border);
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            min-width: 400px;
        }

        .viz-pane {
            width: 450px;
            display: flex;
            flex-direction: column;
            background: #0d0d14;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .panel-header h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-dim);
        }

        #editor-container {
            flex: 1;
            width: 100%;
        }

        .panel {
            background: var(--pane-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .coherence-circle {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 10px auto;
        }

        .coherence-circle svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .circle-bg {
            fill: none;
            stroke: #1e1e35;
            stroke-width: 6;
        }

        .circle-fill {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .coherence-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #coherence-val {
            display: block;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-primary);
            font-family: 'Courier New', monospace;
        }

        .coherence-text small {
            font-size: 0.55rem;
            color: var(--text-dim);
            letter-spacing: 0.1em;
        }

        #log {
            min-height: 150px;
            font-size: 0.75rem;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
            color: #a0ffc0;
            overflow-y: auto;
            max-height: 300px;
        }

        .intention-stack,
        .resonance-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-msg {
            color: #3a3a5a;
            font-size: 0.75rem;
            font-style: italic;
        }

        .intention-item {
            background: #1e1e35;
            border-left: 3px solid var(--accent-primary);
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.75rem;
            color: #c8c8ff;
            animation: slideIn 0.3s ease;
        }

        .resonance-item {
            background: #121f1a;
            border-left: 3px solid var(--accent-secondary);
            padding: 8px 12px;
            border-radius: 0 6px 6px 0;
            font-size: 0.75rem;
            color: var(--accent-secondary);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-10px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .run-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 6px;
            color: #0a0a0f;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 8px 20px;
            transition: all 0.2s;
        }

        .run-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .secondary-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 10px;
            padding: 7px 15px;
        }

        .witness-pulse {
            animation: pulse 0.6s ease;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(180, 136, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(180, 136, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(180, 136, 255, 0);
            }
        }
    </style>
</head>

<body>
    <h1>φ PhiFlow</h1>
    <p class="subtitle">Truth-Namer Playground — Gate 2 Prototype</p>

    <div class="main-container">
        <div class="editor-pane">
            <div class="panel-header" style="padding: 10px 20px; border-bottom: 1px solid var(--border);">
                <h2>Source Code (.phi)</h2>
                <div class="actions">
                    <button class="run-btn" id="run-btn" onclick="runPhiFlow()">▶ RUN</button>
                    <button class="secondary-btn" onclick="copyWat()">COPY .WAT</button>
                </div>
            </div>
            <div id="editor-container"></div>
        </div>

        <div class="viz-pane">
            <div class="panel" id="coherence-panel">
                <div class="panel-header">
                    <h2>System Coherence</h2>
                </div>
                <div class="coherence-circle">
                    <svg viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="circle-fill" id="phi-circle" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="coherence-text">
                        <span id="coherence-val">0.0000</span>
                        <small>COHERENCE</small>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2>Intention Stack</h2>
                </div>
                <div class="intention-stack" id="intention-stack">
                    <span class="empty-msg">No active intentions</span>
                </div>
            </div>

            <div class="panel" id="resonance-panel">
                <div class="panel-header">
                    <h2>Resonance Field</h2>
                </div>
                <div class="resonance-field" id="resonance-field">
                    <span class="empty-msg">Field empty</span>
                </div>
            </div>

            <div class="panel" id="log-panel">
                <div class="panel-header">
                    <h2>Execution Log</h2>
                </div>
                <div id="log">Ready for calibration...</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        // === PhiFlow Browser Host ===
        const PHI = 1.618033988749895;
        const PHI_INV = 0.618033988749895;
        const STRING_BASE = 0x100;

        let editor;
        let coherenceScore = 0.0;
        const resonanceField = [];
        const intentionStack = [];
        const witnessLog = [];

        const logEl = document.getElementById("log");
        const cEl = document.getElementById("coherence-val");
        const phiCircle = document.getElementById("phi-circle");
        const intentEl = document.getElementById("intention-stack");
        const resonEl = document.getElementById("resonance-field");
        const runBtn = document.getElementById("run-btn");
        const logPanel = document.getElementById("log-panel");

        // Monaco Setup
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: `// PhiFlow Truth-Namer Example\nlet witness_val = WITNESS(0.618);\n\nINTENTION("Stabilize") {\n    RESONATE(witness_val);\n    let c = COHERENCE();\n    \n    INTENTION("Refine") {\n        WITNESS(c);\n    }\n}\n\n84`,
                language: 'rust',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false },
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                roundedSelection: false,
                padding: { top: 20 }
            });
        });

        function log(msg, color = "#a0ffc0") {
            const d = document.createElement("div");
            d.style.color = color;
            d.textContent = msg;
            logEl.appendChild(d);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            logEl.innerHTML = "";
        }

        function updateCoherence(val) {
            const clamped = Math.max(0, Math.min(1, Number(val) || 0));
            coherenceScore = clamped;
            cEl.textContent = clamped.toFixed(4);

            const offset = 283 - (clamped * 283);
            phiCircle.style.strokeDashoffset = offset;

            // Color shift based on coherence
            const hue = 260 - (clamped * 120); // 260 (purple) to 140 (teal)
            phiCircle.style.stroke = `hsl(${hue}, 100%, 70%)`;
        }

        function renderIntentions() {
            if (intentionStack.length === 0) {
                intentEl.innerHTML = '<span class="empty-msg">No active intentions</span>';
                return;
            }
            intentEl.innerHTML = intentionStack
                .map((i) => `<div class="intention-item">⟡ ${i}</div>`)
                .join("");
        }

        function renderResonance() {
            if (resonanceField.length === 0) {
                resonEl.innerHTML = '<span class="empty-msg">Field empty</span>';
                return;
            }
            resonEl.innerHTML = resonanceField
                .map((v) => `<div class="resonance-item">≋ ${Number(v).toFixed(4)}</div>`)
                .join("");
        }

        function pulseWitness() {
            logPanel.classList.remove("witness-pulse");
            void logPanel.offsetWidth;
            logPanel.classList.add("witness-pulse");
        }

        function computeCoherence() {
            const depth = intentionStack.length;
            const resonanceCount = resonanceField.length;
            if (depth === 0 && resonanceCount === 0) return 0.0;
            const intentionCoherence = depth > 0 ? (1.0 - Math.pow(PHI, -depth)) : 0.0;
            const resonanceBonus = Math.min(resonanceCount * 0.05, 0.2);
            return Math.min(intentionCoherence + resonanceBonus, 1.0);
        }

        function makeImports(getExports) {
            return {
                phi: {
                    witness: (op) => {
                        pulseWitness();
                        updateCoherence(computeCoherence());
                        const note = `[WITNESS] r${op}  coherence=${coherenceScore.toFixed(4)}  intent=${intentionStack.at(-1) ?? "none"}`;
                        witnessLog.push(note);
                        log(`  ${note}`, "#ffd700");
                        return coherenceScore;
                    },
                    coherence: () => {
                        const score = computeCoherence();
                        updateCoherence(score);
                        log(`  [COHERENCE] ${score.toFixed(4)}`, "#9ad6ff");
                        return score;
                    },
                    resonate: (val) => {
                        resonanceField.push(Number(val));
                        renderResonance();
                        updateCoherence(computeCoherence());
                        log(`  [RESONATE] ${Number(val).toFixed(4)}`, "#61efce");
                    },
                    intention_push: (offset) => {
                        const name = `intent_${offset}`;
                        intentionStack.push(name);
                        renderIntentions();
                        updateCoherence(computeCoherence());
                        log(`  [INTENTION ▶] push "${name}" depth=${intentionStack.length}`, "#b488ff");
                    },
                    intention_pop: () => {
                        const popped = intentionStack.pop();
                        renderIntentions();
                        updateCoherence(computeCoherence());
                        log(`  [INTENTION ◀] pop "${popped ?? "?"}"`, "#b488ff");
                    },
                },
            };
        }

        async function loadWabt() {
            if (typeof WabtModule === "function") return WabtModule();
            const s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/wabt@1.0.36/index.js";
            document.head.appendChild(s);
            return new Promise((r) => s.onload = () => r(WabtModule()));
        }

        async function fetchOutput(ext) {
            try {
                const resp = await fetch(`../output.${ext}`, { cache: "no-store" });
                if (resp.ok) return ext === 'wasm' ? await resp.arrayBuffer() : await resp.text();
            } catch (e) { }
            return null;
        }

        async function runPhiFlow() {
            runBtn.disabled = true;
            clearLog();
            resonanceField.length = 0;
            intentionStack.length = 0;
            witnessLog.length = 0;
            updateCoherence(0.0);
            renderIntentions();
            renderResonance();

            log("=== PhiFlow Truth-Namer Runtime ===", "#e0e0ff");
            log("Calibrating from output.wasm...", "#7a7aaa");

            try {
                let bytes = await fetchOutput('wasm');
                let source = "output.wasm";

                if (!bytes) {
                    const wat = await fetchOutput('wat');
                    if (!wat) throw new Error("No output.wasm or output.wat found. Run cargo example first.");
                    const wabt = await loadWabt();
                    const mod = wabt.parseWat("output.wat", wat, { mutable_globals: true });
                    bytes = mod.toBinary({}).buffer;
                    mod.destroy();
                    source = "output.wat (browser-compiled)";
                }

                log(`Source: ${source}`, "#61efce");

                let wasmExports = null;
                const { instance } = await WebAssembly.instantiate(bytes, makeImports(() => wasmExports));
                wasmExports = instance.exports;

                log("Executing phi_run()...", "#7a7aaa");
                const res = wasmExports.phi_run();

                log("");
                log(`Result:    Number(${Number(res).toFixed(4)})`, "#ffffff");
                log(`Coherence: ${coherenceScore.toFixed(4)}`, "#ffd700");
                log("");
                log("=== Calibration Complete ===", "#e0e0ff");

            } catch (err) {
                log(`[ERROR] ${err.message}`, "#ff7a7a");
            } finally {
                runBtn.disabled = false;
            }
        }

        function copyWat() {
            fetchOutput('wat').then(wat => {
                if (wat) {
                    navigator.clipboard.writeText(wat);
                    alert("WAT copied to clipboard");
                } else {
                    alert("output.wat not found");
                }
            });
        }
    </script>
</body>

</html>
