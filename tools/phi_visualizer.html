<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhiFlow — Living Sound</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; color: #fff;
         font-family: 'Georgia', serif; }
  #info { position: absolute; top: 10px; left: 10px; z-index: 100;
          background: rgba(0,0,0,0.75); padding: 16px 20px; border-radius: 12px;
          font-size: 14px; line-height: 1.8; max-width: 380px; }
  #info h1 { font-size: 18px; margin: 0 0 6px 0; color: #4af;
             font-weight: normal; letter-spacing: 1px; }
  #status { color: #fa0; font-size: 12px; }
  #status.connected { color: #4f4; }
  #audio-status { color: #888; font-size: 12px; margin-top: 4px; }
  #audio-status.on { color: #4f4; }
  #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
               z-index: 200; padding: 20px 40px; font-size: 20px; cursor: pointer;
               background: rgba(68,136,255,0.2); color: #4af; border: 2px solid #4af;
               border-radius: 12px; font-family: 'Georgia', serif; letter-spacing: 2px;
               transition: all 0.3s; }
  #start-btn:hover { background: rgba(68,136,255,0.4); color: #fff; }
  #events { position: absolute; bottom: 10px; left: 10px; z-index: 100;
            background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
            font-size: 11px; max-height: 180px; overflow-y: auto; width: 380px;
            font-family: 'Courier New', monospace; }
  #events div { margin: 2px 0; }
  .ev-push { color: #4af; }
  .ev-pop { color: #a4f; }
  .ev-witness { color: #ff4; }
  .ev-resonate { color: #4f4; }
  .ev-coherence { color: #fa0; }
  .ev-start { color: #fff; font-weight: bold; }
  .ev-end { color: #f44; font-weight: bold; }
  .ev-sensor { color: #4ff; }
  #freq-display { position: absolute; top: 10px; right: 10px; z-index: 100;
                  background: rgba(0,0,0,0.7); padding: 14px 18px; border-radius: 10px;
                  font-size: 13px; line-height: 1.7; text-align: right; }
  #freq-display h2 { font-size: 14px; color: #4af; margin: 0 0 6px 0; font-weight: normal; }
  .freq-row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .freq-dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.2; transition: opacity 0.3s; }
  .freq-dot.active { opacity: 1; box-shadow: 0 0 8px currentColor; }
  canvas { display: block; }
</style>
</head>
<body>

<button id="start-btn">▶ Enable Sound &amp; Begin</button>

<div id="info">
  <h1>PhiFlow — Living Sound</h1>
  <div id="status">Click the button to start</div>
  <div>Coherence: <span id="coherence">—</span></div>
  <div>Active voices: <span id="intentions">0</span></div>
  <div>Witnesses: <span id="witnesses">0</span></div>
  <div id="audio-status">Audio: off</div>
</div>

<div id="freq-display">
  <h2>Sacred Frequencies</h2>
  <div class="freq-row"><span id="freq-432">432 Hz — Ground</span> <span class="freq-dot" style="color:#4488ff" id="dot-432"></span></div>
  <div class="freq-row"><span id="freq-528">528 Hz — Create</span> <span class="freq-dot" style="color:#44ff88" id="dot-528"></span></div>
  <div class="freq-row"><span id="freq-594">594 Hz — Heart</span> <span class="freq-dot" style="color:#ff4488" id="dot-594"></span></div>
  <div class="freq-row"><span id="freq-672">672 Hz — Voice</span> <span class="freq-dot" style="color:#ffaa44" id="dot-672"></span></div>
  <div class="freq-row"><span id="freq-720">720 Hz — Vision</span> <span class="freq-dot" style="color:#aa44ff" id="dot-720"></span></div>
  <div class="freq-row"><span id="freq-768">768 Hz — Unity</span> <span class="freq-dot" style="color:#ffffff" id="dot-768"></span></div>
</div>

<div id="events"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  WEB AUDIO — Each intention becomes a living voice
// ═══════════════════════════════════════════════════════════════════

let audioCtx = null;
let masterGain = null;
let masterFilter = null;
let reverbNode = null;
let audioReady = false;

// Sacred frequency → name mapping
const sacredFreqs = {
  432: 'ground', 528: 'create', 594: 'integrate',
  672: 'voice', 720: 'transcend', 768: 'unity', 963: 'source'
};

// Reverse lookup: intention name → frequency
const intentionFreqs = {
  'ground': 432, 'create': 528, 'integrate': 594, 'heart': 594,
  'voice': 672, 'expression': 672, 'transcend': 720, 'vision': 720,
  'unity': 768, 'source': 963, 'healing': 528, 'analysis': 672,
  'calibrate': 432, 'sample': 528, 'analyze': 672, 'alert': 768,
};

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Master chain: filter → gain → destination
  masterFilter = audioCtx.createBiquadFilter();
  masterFilter.type = 'lowpass';
  masterFilter.frequency.value = 2000;  // warm
  masterFilter.Q.value = 1;

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;

  // Simple reverb via convolver with generated impulse
  reverbNode = audioCtx.createConvolver();
  reverbNode.buffer = createImpulseResponse(2.0, 2.5);

  const dryGain = audioCtx.createGain(); dryGain.gain.value = 0.7;
  const wetGain = audioCtx.createGain(); wetGain.gain.value = 0.3;

  masterFilter.connect(dryGain);
  masterFilter.connect(reverbNode);
  reverbNode.connect(wetGain);
  dryGain.connect(masterGain);
  wetGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);

  audioReady = true;
  document.getElementById('audio-status').textContent = 'Audio: on';
  document.getElementById('audio-status').className = 'on';
}

function createImpulseResponse(duration, decay) {
  const rate = audioCtx.sampleRate;
  const length = rate * duration;
  const impulse = audioCtx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

// Create a sustained voice for an intention
function createVoice(freq) {
  if (!audioReady) return null;

  const osc = audioCtx.createOscillator();
  const oscPhi = audioCtx.createOscillator();  // phi harmonic overtone
  const gain = audioCtx.createGain();
  const gainPhi = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.value = freq;
  oscPhi.type = 'sine';
  oscPhi.frequency.value = freq * 1.618033988;  // phi harmonic

  gain.gain.value = 0;  // start silent, fade in
  gainPhi.gain.value = 0;

  osc.connect(gain);
  oscPhi.connect(gainPhi);
  gain.connect(masterFilter);
  gainPhi.connect(masterFilter);

  osc.start();
  oscPhi.start();

  // Fade in
  gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.5);
  gainPhi.gain.linearRampToValueAtTime(0.03, audioCtx.currentTime + 0.5);

  return { osc, oscPhi, gain, gainPhi, freq };
}

function stopVoice(voice) {
  if (!voice || !audioReady) return;
  const t = audioCtx.currentTime;
  voice.gain.gain.cancelScheduledValues(t);
  voice.gainPhi.gain.cancelScheduledValues(t);
  voice.gain.gain.setValueAtTime(voice.gain.gain.value, t);
  voice.gainPhi.gain.setValueAtTime(voice.gainPhi.gain.value, t);
  voice.gain.gain.linearRampToValueAtTime(0, t + 1.5);  // slow fade
  voice.gainPhi.gain.linearRampToValueAtTime(0, t + 1.5);
  voice.osc.stop(t + 1.6);
  voice.oscPhi.stop(t + 1.6);
}

function pulseVoice(voice) {
  if (!voice || !audioReady) return;
  const t = audioCtx.currentTime;
  const peak = 0.3;
  voice.gain.gain.cancelScheduledValues(t);
  voice.gain.gain.setValueAtTime(voice.gain.gain.value, t);
  voice.gain.gain.linearRampToValueAtTime(peak, t + 0.05);
  voice.gain.gain.exponentialRampToValueAtTime(0.15, t + 0.8);
}

function playBell(freq, coherence) {
  if (!audioReady) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq * 2;  // octave up for bell
  gain.gain.value = 0;
  gain.gain.linearRampToValueAtTime(0.2 * coherence + 0.05, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
  osc.connect(gain);
  gain.connect(masterFilter);
  osc.start(t);
  osc.stop(t + 2.1);
}

function updateCoherenceFilter(coherence) {
  if (!audioReady) return;
  // High coherence = warm (low filter), low coherence = bright/harsh (high filter)
  // Actually: high coherence = open and rich, low = muffled
  const target = 500 + coherence * 4000;
  masterFilter.frequency.linearRampToValueAtTime(target, audioCtx.currentTime + 0.3);
}

// ═══════════════════════════════════════════════════════════════════
//  THREE.JS SCENE
// ═══════════════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000008, 0.012);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 8, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x222244, 0.5));
const pointLight = new THREE.PointLight(0x4488ff, 2, 100);
pointLight.position.set(0, 15, 0);
scene.add(pointLight);

// ─── PhiFlow State ──────────────────────────────────────────────────
const intentions = new Map();
const resonances = [];
const witnesses = [];
let globalCoherence = 0;
let witnessCount = 0;

const freqColors = {
  432: 0x4488ff, 528: 0x44ff88, 594: 0xff4488,
  672: 0xffaa44, 720: 0xaa44ff, 768: 0xffffff, 963: 0x44ffff,
};

function freqForIntention(name) {
  const lower = name.toLowerCase();
  for (const [key, freq] of Object.entries(intentionFreqs)) {
    if (lower.includes(key)) return freq;
  }
  // Hash to nearest sacred frequency
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = hash * 31 + name.charCodeAt(i);
  const sacreds = [432, 528, 594, 672, 720, 768, 963];
  return sacreds[Math.abs(hash) % sacreds.length];
}

function colorForFreq(freq) {
  return new THREE.Color(freqColors[freq] || 0x888888);
}

// ─── 3D Object Creation ─────────────────────────────────────────────
function createIntentionMesh(name, depth) {
  const freq = freqForIntention(name);
  const color = colorForFreq(freq);
  const radius = 2.5 + depth * 0.8;

  // Outer wireframe sphere
  const geo = new THREE.IcosahedronGeometry(radius, 1);
  const mat = new THREE.MeshBasicMaterial({
    color: color, wireframe: true, transparent: true, opacity: 0.5
  });
  const mesh = new THREE.Mesh(geo, mat);

  // Inner glowing core
  const coreGeo = new THREE.SphereGeometry(radius * 0.35, 24, 24);
  const coreMat = new THREE.MeshBasicMaterial({
    color: color, transparent: true, opacity: 0.3
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  mesh.add(core);

  // Glow halo (larger transparent sphere)
  const haloGeo = new THREE.SphereGeometry(radius * 1.5, 16, 16);
  const haloMat = new THREE.MeshBasicMaterial({
    color: color, transparent: true, opacity: 0.05, side: THREE.BackSide
  });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  mesh.add(halo);

  // Position in a circle
  const angle = (intentions.size / 8) * Math.PI * 2;
  const dist = 10 + depth * 3;
  mesh.position.set(Math.cos(angle) * dist, depth * 3, Math.sin(angle) * dist);

  // Label
  const canvas2 = document.createElement('canvas');
  canvas2.width = 256; canvas2.height = 80;
  const ctx = canvas2.getContext('2d');
  ctx.fillStyle = '#' + color.getHexString();
  ctx.font = 'bold 22px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText(name, 128, 30);
  ctx.font = '16px Georgia';
  ctx.fillStyle = '#aaa';
  ctx.fillText(freq + ' Hz', 128, 55);
  const texture = new THREE.CanvasTexture(canvas2);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(5, 1.5, 1);
  sprite.position.set(0, radius + 2, 0);
  mesh.add(sprite);

  // Create audio voice
  const voice = createVoice(freq);

  // Light up the frequency dot
  const dot = document.getElementById('dot-' + freq);
  if (dot) dot.classList.add('active');

  scene.add(mesh);
  return { mesh, core, halo, sprite, color, radius, age: 0, name, freq, voice, resonatePulse: 0 };
}

function createResonanceBeam(fromPos, toPos, color) {
  const points = [fromPos.clone(), toPos.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: color, transparent: true, opacity: 0.7, linewidth: 2
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  return { line, age: 0 };
}

function createWitnessFlash(position, coherence) {
  const geo = new THREE.SphereGeometry(0.5, 12, 12);
  const color = new THREE.Color().setHSL(0.15 * coherence, 0.8, 0.6);
  const mat = new THREE.MeshBasicMaterial({
    color: color, transparent: true, opacity: 0.9
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(position);
  scene.add(mesh);
  return { mesh, age: 0, coherence };
}

// ─── OSC Message Handling ───────────────────────────────────────────
function handleOscMessage(address, args) {
  if (address === '/phi/start') {
    logEvent('start', `▶ ${args[0]}`);
  }
  else if (address === '/phi/end') {
    logEvent('end', `■ End — coherence ${args[0].toFixed(4)}`);
  }
  else if (address === '/phi/intention/push') {
    const name = args[0];
    const depth = args[1];
    const obj = createIntentionMesh(name, depth);
    intentions.set(name, obj);
    document.getElementById('intentions').textContent = intentions.size;
    logEvent('push', `→ ${name} (depth ${depth})`);
  }
  else if (address === '/phi/intention/pop') {
    const name = args[0];
    const obj = intentions.get(name);
    if (obj) {
      obj.fading = true;
      stopVoice(obj.voice);
      const dot = document.getElementById('dot-' + obj.freq);
      if (dot) dot.classList.remove('active');
    }
    logEvent('pop', `← ${name}`);
  }
  else if (address === '/phi/witness') {
    const coherence = args[0];
    const time = args[1];
    const intention = args[2];
    const obj = intentions.get(intention);
    if (obj) {
      const flash = createWitnessFlash(obj.mesh.position, coherence);
      witnesses.push(flash);
      // Play a bell at the intention's frequency
      playBell(obj.freq, coherence);
    }
    witnessCount++;
    document.getElementById('witnesses').textContent = witnessCount;
    logEvent('witness', `👁 ${coherence.toFixed(3)} in "${intention}"`);
  }
  else if (address === '/phi/resonate') {
    const intention = args[0];
    const value = args[1];
    const obj = intentions.get(intention);
    if (obj) {
      obj.resonatePulse = 1.0;
      pulseVoice(obj.voice);
      // Beam to nearest other intention
      for (const [otherName, other] of intentions) {
        if (otherName !== intention && !other.fading) {
          const beam = createResonanceBeam(obj.mesh.position, other.mesh.position, obj.color);
          resonances.push(beam);
          break;
        }
      }
    }
    logEvent('resonate', `🌊 ${intention}: ${value}`);
  }
  else if (address === '/phi/coherence') {
    globalCoherence = args[0];
    document.getElementById('coherence').textContent = globalCoherence.toFixed(4);
    updateCoherenceFilter(globalCoherence);
    logEvent('coherence', `◆ ${globalCoherence.toFixed(4)}`);
  }
  else if (address === '/phi/sensor') {
    logEvent('sensor', `📡 ${args[0]} = ${args[1]}`);
  }
}

function logEvent(type, msg) {
  const div = document.createElement('div');
  div.className = 'ev-' + type;
  div.textContent = msg;
  const log = document.getElementById('events');
  log.insertBefore(div, log.firstChild);
  while (log.children.length > 25) log.removeChild(log.lastChild);
}

// ─── WebSocket Connection ───────────────────────────────────────────
const wsPort = 18528;
const urlParams = new URLSearchParams(location.search);
const hostParam = urlParams.get('host');
let wsHost = hostParam || 'localhost';
let wsUrl = `ws://${wsHost}:${wsPort}`;
const statusEl = document.getElementById('status');

function connect() {
  statusEl.textContent = `Connecting to ${wsUrl}...`;
  const ws = new WebSocket(wsUrl);
  ws.onopen = () => {
    statusEl.textContent = `✅ Connected — run: phic --osc 18032 --osc-delay 500 your_program.phi`;
    statusEl.className = 'connected';
  };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    handleOscMessage(msg.address, msg.args);
  };
  ws.onclose = () => {
    statusEl.textContent = `❌ Can't reach ${wsHost}:${wsPort}. Try: ?host=YOUR_WSL_IP`;
    statusEl.className = '';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { ws.close(); };
}

// ─── Start Button (browsers require user gesture for audio) ─────────
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-btn').style.display = 'none';
  connect();
});

// ─── Animation Loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // Update intentions
  for (const [name, obj] of intentions) {
    obj.age += dt;
    obj.mesh.rotation.y += dt * 0.3;
    obj.mesh.rotation.x += dt * 0.1;

    // Resonate pulse
    if (obj.resonatePulse > 0) {
      obj.resonatePulse -= dt * 2;
      const s = 1 + obj.resonatePulse * 0.6;
      obj.core.scale.set(s, s, s);
      obj.halo.material.opacity = 0.05 + obj.resonatePulse * 0.15;
    } else {
      obj.core.scale.lerp(new THREE.Vector3(1,1,1), dt * 3);
      obj.halo.material.opacity *= 0.98;
    }

    // Gentle breathing
    const breathe = 1 + Math.sin(t * 1.5 + obj.age) * 0.03;
    obj.mesh.scale.set(breathe, breathe, breathe);

    // Fade out
    if (obj.fading) {
      obj.mesh.material.opacity *= 0.96;
      obj.core.material.opacity *= 0.96;
      obj.halo.material.opacity *= 0.96;
      obj.sprite.material.opacity *= 0.96;
      if (obj.mesh.material.opacity < 0.01) {
        scene.remove(obj.mesh);
        intentions.delete(name);
      }
    }
  }

  // Update resonance beams
  for (let i = resonances.length - 1; i >= 0; i--) {
    const r = resonances[i];
    r.age += dt;
    r.line.material.opacity = Math.max(0, 0.7 - r.age * 1.5);
    if (r.age > 0.5) {
      scene.remove(r.line);
      resonances.splice(i, 1);
    }
  }

  // Update witness flashes
  for (let i = witnesses.length - 1; i >= 0; i--) {
    const w = witnesses[i];
    w.age += dt;
    const s = 1 + w.age * 6;
    w.mesh.scale.set(s, s, s);
    w.mesh.material.opacity = Math.max(0, 0.9 - w.age * 2.5);
    if (w.age > 0.4) {
      scene.remove(w.mesh);
      witnesses.splice(i, 1);
    }
  }

  // Coherence controls lighting
  pointLight.intensity = 1.5 + globalCoherence * 4;
  pointLight.color.setHSL(0.6 - globalCoherence * 0.3, 0.7, 0.5);
  scene.fog.density = 0.012 - globalCoherence * 0.008;

  // Camera slowly orbits
  camera.position.x = Math.cos(t * 0.08) * 30;
  camera.position.z = Math.sin(t * 0.08) * 30;
  camera.position.y = 8 + Math.sin(t * 0.05) * 3;
  camera.lookAt(0, 3, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
