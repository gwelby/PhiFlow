[package]
name = "phiflow"
version = "0.4.0"
edition = "2021"
authors = ["PhiFlow Team <team@phiflow.dev>"]
description = "PhiFlow - Quantum consciousness programming language"
license = "MIT"
repository = "https://github.com/phiflow/phiflow"
keywords = ["quantum", "consciousness", "dsl", "sacred-geometry", "phi"]
categories = ["compilers", "science", "development-tools"]

[[bin]]
name = "phic"
path = "src/main_cli.rs"

[[bin]]
name = "type4_benchmark"
path = "src/bin/type4_benchmark.rs"

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full", "process"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
num-complex = "0.4" # Added for Mandelbrot set

# Type 4 Observer Metrics (T4-001)
statrs = "0.17"
ndarray = { version = "0.15", features = ["serde"] }
ndarray-linalg = { version = "0.16", features = ["intel-mkl-static"], optional = true }

# Quantum computing backends
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"], default-features = false }
base64 = "0.21"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Consciousness monitoring (EEG) - placeholder for future implementation  
# eeg-rs = { version = "0.1", optional = true }

# Audio/Frequency processing (cpal requires libasound2-dev; optional until system dep resolved)
cpal = { version = "0.15", optional = true }
hound = "3.5"
rustfft = "6.1"

# Mathematical operations
nalgebra = "0.32"
rand = "0.8"
sysinfo = "0.30"
pqcrypto-dilithium = { version = "0.5.0", features = ["serialization"] }
pqcrypto-traits = "0.3.5"
wasmtime = "25.0"
wat = "1.0"
rumqttc = "0.24"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"

[features]
default = []
audio = ["dep:cpal"]
linalg = ["dep:ndarray-linalg"]

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[profile.release]
lto = "thin"        # fat LTO + wasmtime-fiber = OOM on Windows; thin LTO ships and optimizes
codegen-units = 4   # 1 unit exhausted paging file; 4 units fit in RAM
panic = "abort"
