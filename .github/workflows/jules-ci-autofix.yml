name: Jules Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ["PhiFlow Tests"]
    types: [completed]

jobs:
  fix-failure:
    # Only run when CI fails, and only on master (the default branch)
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Check for recent Jules fix PR (prevent loops)
        id: check-loop
        uses: actions/github-script@v7
        with:
          script: |
            // Only block if there's a Jules fix PR opened in the last 24 hours.
            // Stale PRs (older than 24h) don't block — they may be abandoned.
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
              sort: 'created',
              direction: 'desc'
            });
            const now = Date.now();
            const oneDayMs = 24 * 60 * 60 * 1000;
            const recentJulesPRs = prs.data.filter(pr => {
              const isJules = pr.head.ref.startsWith('fix-ci-') ||
                              pr.head.ref.startsWith('fix-') ||
                              pr.head.ref.includes('jules') ||
                              (pr.title || '').toLowerCase().includes('jules');
              if (!isJules) return false;
              const created = new Date(pr.created_at).getTime();
              return (now - created) < oneDayMs;
            });
            core.setOutput('has_open_jules_pr', recentJulesPRs.length > 0);
            if (recentJulesPRs.length > 0) {
              console.log(`Found ${recentJulesPRs.length} recent Jules PR(s) (last 24h) — skipping to prevent loop`);
            } else {
              console.log('No recent Jules PRs — safe to dispatch');
            }

      - name: Invoke Jules to fix CI failure
        if: steps.check-loop.outputs.has_open_jules_pr != 'true'
        uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            The CI workflow "PhiFlow Tests" has failed on the master branch.

            Failed run: ${{ github.event.workflow_run.html_url }}
            Commit: ${{ github.event.workflow_run.head_sha }}

            Read AGENTS.md in this repo first for project conventions.

            Tool rules:
            - Use rg (ripgrep) for text search, not grep. It is installed and faster.
            - Do NOT attempt to reach any service on localhost or 172.28.x.x — those are unreachable.

            Steps:
            1. Analyze the CI failure — check what tests failed and why
            2. Read the failing test files AND the source code they test
            3. Identify the root cause (import error, assertion failure, missing module, etc.)
            4. Implement a minimal, targeted fix
            5. Run the test suite locally to verify your fix works
            6. If tests fail for a pre-existing reason not caused by your change, note it in the PR
            7. Open a PR with a clear title explaining what was broken and how you fixed it

            CONSTRAINTS — CRITICAL:
            - Touch ONLY the files needed to fix the failing tests. Do NOT touch unrelated files.
            - Do NOT delete tests. SKIP them with @unittest.skipIf(condition, reason) if a dependency is missing.
            - Do NOT use sys.exit() in test files. Use pytest.skip() or skipIf().
            - Do NOT use unconditional @pytest.mark.skip. Always use conditional skip (skipIf).
            - Keep the PR under 200 lines if possible. Minimal changes only.
            - Do NOT refactor, reformat, or "clean up" code that isn't directly causing the failure.

            Do NOT merge your own PR. Leave it for Greg to review.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          include_last_commit: true
