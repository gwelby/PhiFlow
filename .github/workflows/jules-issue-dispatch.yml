name: Jules Issue Dispatch

on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    # Only run when the 'jules' label is added
    if: github.event.label.name == 'jules'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write

    steps:
      - name: Invoke Jules
        # SECURITY: Only allow Greg (gwelby) to trigger Jules via issue labels
        if: ${{ contains(fromJSON('["gwelby", "greg"]'), github.event.issue.user.login) }}
        uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            Read AGENTS.md in this repo first for project conventions.

            Tool rules:
            - Use rg (ripgrep) for text search, not grep. It is installed and faster.
            - Do NOT attempt to reach any service on localhost or 172.28.x.x — those are unreachable.

            Please implement the following issue:

            ## ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Process:
            1. Understand the issue — read the relevant source files and tests
            2. Plan your changes — keep them minimal and targeted
            3. Implement the fix or feature
            4. Run the existing test suite to verify nothing breaks
            5. If the issue asks for tests, add them
            6. Open a PR that references this issue (use "Fixes #N" in the description)

            CONSTRAINTS — CRITICAL:
            - Touch ONLY the files needed to fix the issue. Do NOT touch unrelated files.
            - Do NOT delete tests. SKIP them with @unittest.skipIf(condition, reason) if a dependency is missing.
            - Do NOT use sys.exit() in test files. Use pytest.skip() or skipIf().
            - Do NOT use unconditional @pytest.mark.skip. Always use conditional skip (skipIf).
            - Keep the PR under 200 lines if possible. Minimal changes only.
            - Do NOT refactor, reformat, or "clean up" code that isn't directly related to the issue.

            Known failure patterns (Jules PATTERNS.md):
            - FP-001: You run in a cloud VM with ONLY this repo checked out. /mnt/d/, D:\, and ~ paths do not exist. Use repo-relative paths only.
            - FP-002: Commit ALL changes in ONE commit on the PR branch. Work split across multiple local branches does not reach the PR.
            - FP-003: If the issue is a CI failure and the exact error is not in the issue body, fetch the failing step and error text before changing anything. Do NOT assume the workflow file is the problem.
            - LP-002: A green check proves tests pass, not that the fix is correct. State exactly what you verified.
            Do NOT merge your own PR. Leave it for Greg to review.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: master
          include_last_commit: false
          include_commit_log: false
